name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_ACCESS_SECRET: ci-test-access-secret-minimum-16-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-16-chars

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campusops_test
          POSTGRES_USER: campusops
          POSTGRES_PASSWORD: campusops_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://campusops:campusops_secret@localhost:5432/campusops_test

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://campusops:campusops_secret@localhost:5432/campusops_test

      - name: Seed test data
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://campusops:campusops_secret@localhost:5432/campusops_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://campusops:campusops_secret@localhost:5432/campusops_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-integration-access-secret-32-chars-long
          JWT_REFRESH_SECRET: ci-integration-refresh-secret-32-chars-long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          BCRYPT_SALT_ROUNDS: 8
          CORS_ORIGIN: http://localhost:3000
          APP_URL: http://localhost:3000
          LOG_LEVEL: error
